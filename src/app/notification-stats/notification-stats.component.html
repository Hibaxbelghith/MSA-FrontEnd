<div class="stats-container">
  <h2>Notification Statistics</h2>

  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Loading statistics...</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
    <button mat-button color="primary" (click)="refreshStats()">Retry</button>
  </div>

  <div *ngIf="!isLoading && !errorMessage" class="stats-content">
    <div class="stat-summary">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Total Notifications</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="total-count">{{ totalNotifications }}</div>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="chart-container">
      <canvas baseChart
        [data]="pieChartData"
        [options]="pieChartOptions"
        [type]="pieChartType">
      </canvas>
    </div>

    <div class="refresh-button">
      <button mat-raised-button color="primary" (click)="refreshStats()">
        <mat-icon>refresh</mat-icon>
        Refresh Statistics
      </button>
    </div>

    <div class="download-button">
      <button mat-raised-button color="accent" (click)="downloadPdf()">
        <mat-icon>download</mat-icon>
        Download Notifications PDF
      </button>
    </div>
  </div>
</div>
