<div class="container mt-5">
    <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 pb-5">
    <div class="card shadow-lg">
    <div class="card-body">
    <h2 class="text-center mb-4">Modifier le client</h2>
    <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="firstname">Firstname</label>
        <input type="text" id="firstname" class="form-control" formControlName="firstname"
        [ngClass]="{ 'is-invalid': f['firstname'].invalid && f['firstname'].touched }">
        <div *ngIf="f['firstname']?.invalid && f['firstname']?.touched" class="invalid-feedback">
          <small *ngIf="f['firstname']?.errors?.['required']">First Name is required</small>
        </div>
      </div>
      
      <div class="form-group">
        <label for="lastname">Lastname</label>
        <input type="text" id="lastname" class="form-control" formControlName="lastname" 
        [ngClass]="{ 'is-invalid': f['lastname'].invalid && f['lastname'].touched }">
        <div *ngIf="f['lastname']?.invalid && f['lastname']?.touched" class="invalid-feedback">
          <small *ngIf="f['lastname']?.errors?.['required']">Last Name is required.</small>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" formControlName="email" 
        [ngClass]="{ 'is-invalid': f['email'].invalid && f['email'].touched }">
        <div *ngIf="f['email']?.invalid && f['email']?.touched" class="invalid-feedback">
          <small *ngIf="f['email']?.errors?.['required']">Email is required.</small>
          <small *ngIf="f['email']?.errors?.['email']">Please enter a valid email.</small>
        </div>
      </div>
      
      <div formGroupName="address">
        <label for="street">Street</label>
        <input id="street" type="text" formControlName="street" class="form-control"
        [ngClass]="{ 'is-invalid': f['address'].get('street')?.invalid && f['address'].get('street')?.touched }">
        
        <label for="houseNumber">HouseNumber</label>
        <input id="houseNumber" type="text" formControlName="houseNumber" class="form-control"
        [ngClass]="{ 'is-invalid': f['address'].get('houseNumber')?.invalid && f['address'].get('houseNumber')?.touched }">
      
        <label for="zipCode">ZipCode</label>
        <input id="zipCode" type="text" formControlName="zipCode" class="form-control" [ngClass]="{ 'is-invalid': f['address'].get('zipCode')?.invalid && f['address'].get('zipCode')?.touched }"
        >
      </div>
  
      <button type="submit" class="btn btn-primary mt-3" [disabled]="customerForm.invalid">Sauvegarder</button>
    </form>
  
    <div *ngIf="successMessage" class="alert alert-success mt-3">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger mt-3">
      {{ errorMessage }}
    </div>
  </div>
    </div>
    </div>
    </div>
