<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg">
        <div class="card-body">
    <h2 class="text-center">Reset Your Password</h2>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          class="form-control mb-3"
          formControlName="newPassword"
          placeholder="Enter new password"
        />
        <div *ngIf="resetPasswordForm.get('newPassword')?.touched && resetPasswordForm.get('newPassword')?.invalid" class="text-danger">
          <small *ngIf="resetPasswordForm.get('newPassword')?.hasError('required')">Password is required</small>
          <small *ngIf="resetPasswordForm.get('newPassword')?.hasError('minlength')">Password must be at least 6 characters</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          class="form-control mb-3"
          formControlName="confirmPassword"
          placeholder="Confirm new password"
        />
        <div *ngIf="resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.get('confirmPassword')?.invalid" class="text-danger">
          <small *ngIf="resetPasswordForm.get('confirmPassword')?.hasError('required')">Confirm Password is required</small>
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary w-100" [disabled]="resetPasswordForm.invalid">Reset Password</button>
    </form>
  </div>
  </div>
  </div>
  </div>
  </div>
