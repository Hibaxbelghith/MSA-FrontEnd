<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 pb-5">
      <div class="card shadow-lg">
        <div class="card-body">
          <h2 class="text-center mb-4">Create Your Account</h2>
          <form [formGroup]="signupForm" (ngSubmit)="onSignup()">
            <div class="mb-3">
              <label for="firstname" class="form-label">First Name</label>
              <input
                id="firstname"
                type="text"
                class="form-control"
                formControlName="firstname"
                [ngClass]="{ 'is-invalid': f['firstname'].invalid && f['firstname'].touched }"
              />
              <div *ngIf="f['firstname']?.invalid && f['firstname']?.touched" class="invalid-feedback">
                <small *ngIf="f['firstname']?.errors?.['required']">First Name is required</small>
              </div>
            </div>

            <div class="mb-3">
              <label for="lastname" class="form-label">Last Name</label>
              <input
                id="lastname"
                type="text"
                class="form-control"
                formControlName="lastname"
                [ngClass]="{ 'is-invalid': f['lastname'].invalid && f['lastname'].touched }"
              />
              <div *ngIf="f['lastname']?.invalid && f['lastname']?.touched" class="invalid-feedback">
                <small *ngIf="f['lastname']?.errors?.['required']">Last Name is required.</small>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                id="email"
                type="email"
                class="form-control"
                formControlName="email"
                [ngClass]="{ 'is-invalid': f['email'].invalid && f['email'].touched }"
              />
              <div *ngIf="f['email']?.invalid && f['email']?.touched" class="invalid-feedback">
                <small *ngIf="f['email']?.errors?.['required']">Email is required.</small>
                <small *ngIf="f['email']?.errors?.['email']">Please enter a valid email.</small>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                id="password"
                type="password"
                class="form-control"
                formControlName="password"
                [ngClass]="{ 'is-invalid': f['password'].invalid && f['password'].touched }"
              />
              <div *ngIf="f['password']?.invalid && f['password']?.touched" class="invalid-feedback">
                <small *ngIf="f['password']?.errors?.['required']">Password is required</small>
                <small *ngIf="f['password']?.errors?.['minlength']">Password must be at least 6 characters long</small>
              </div>
            </div>

            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <div formGroupName="address">
                <div class="mb-3">
                  <label for="street" class="form-label">Street</label>
                  <input
                    id="street"
                    type="text"
                    class="form-control"
                    formControlName="street"
                    [ngClass]="{ 'is-invalid': f['address'].get('street')?.invalid && f['address'].get('street')?.touched }"
                  />
                  <div *ngIf="f['address']?.get('street')?.invalid && f['address']?.get('street')?.touched" class="invalid-feedback">
                    <small *ngIf="f['address']?.get('street')?.errors?.['required']">Street is required.</small>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="houseNumber" class="form-label">House Number</label>
                  <input
                    id="houseNumber"
                    type="text"
                    class="form-control"
                    formControlName="houseNumber"
                    [ngClass]="{ 'is-invalid': f['address'].get('houseNumber')?.invalid && f['address'].get('houseNumber')?.touched }"
                  />
                  <div *ngIf="f['address']?.get('houseNumber')?.invalid && f['address'].get('houseNumber')?.touched" class="invalid-feedback">
                    <small *ngIf="f['address']?.get('houseNumber')?.errors?.['required']">House Number is required</small>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="zipCode" class="form-label">Zip Code</label>
                  <input
                    id="zipCode"
                    type="text"
                    class="form-control"
                    formControlName="zipCode"
                    [ngClass]="{ 'is-invalid': f['address'].get('zipCode')?.invalid && f['address'].get('zipCode')?.touched }"
                  />
                  <div *ngIf="f['address']?.get('zipCode')?.invalid && f['address'].get('zipCode')?.touched" class="invalid-feedback">
                    <small *ngIf="f['address']?.get('zipCode')?.errors?.['required']">Zip Code is required.</small>
                  </div>
                </div>
              </div>
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger">
              {{ errorMessage }}
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="signupForm.invalid">Sign Up</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
