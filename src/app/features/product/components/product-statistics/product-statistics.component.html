<div class="container mt-4">
    <h2>Product Statistics</h2>
    
    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>
  
    <div *ngIf="stats && !isLoading" class="card">
      <div class="card-body">
        <h4 class="card-title">Total Sales</h4>
        <p class="card-text display-4">{{ stats.totalSales | currency }}</p>
        
        <h4 class="mt-4">Top Products</h4>
        <div class="row">
          <div *ngFor="let product of stats.topProducts" class="col-md-4 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.description | truncate:50 }}</p>
                <p class="card-text text-success">{{ product.price | currency }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <div class="mt-3">
      <button routerLink="/products" class="btn btn-secondary">Back to Products</button>
    </div>
  </div>
