<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="name" class="form-label">Product Name</label>
      <input type="text" class="form-control" id="name" formControlName="name">
      <div *ngIf="productForm.get('name')?.invalid && (productForm.get('name')?.dirty || productForm.get('name')?.touched)"
           class="text-danger">
        Product name is required
      </div>
    </div>
  
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" formControlName="description" rows="3"></textarea>
      <div *ngIf="productForm.get('description')?.invalid && (productForm.get('description')?.dirty || productForm.get('description')?.touched)"
           class="text-danger">
        Description is required
      </div>
    </div>
  
    <div class="mb-3">
      <label for="price" class="form-label">Price</label>
      <input type="number" class="form-control" id="price" formControlName="price" min="0" step="0.01">
      <div *ngIf="productForm.get('price')?.invalid && (productForm.get('price')?.dirty || productForm.get('price')?.touched)"
           class="text-danger">
        Valid price is required (minimum 0)
      </div>
    </div>
  
    <div class="mb-3">
      <label for="quantity" class="form-label">Available Quantity</label>
      <input type="number" class="form-control" id="quantity" formControlName="availableQuantity" min="0">
      <div *ngIf="productForm.get('availableQuantity')?.invalid && (productForm.get('availableQuantity')?.dirty || productForm.get('availableQuantity')?.touched)"
           class="text-danger">
        Valid quantity is required (minimum 0)
      </div>
    </div>
  
    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select class="form-select" id="category" formControlName="categoryId">
        <option value="">Select a category</option>
        <!-- You would typically populate this from a service -->
        <option value="1">Vêtements</option>
        <option value="2">Chaussures</option>
        <option value="3">Électronique</option>
        <option value="4">Maison</option>   
        <option value="5">Jouets</option>
        <option value="6">Livres</option>
        <option value="7">Sport</option>
        <option value="8">Beauté</option>
        <option value="9">Jardin</option>
        <option value="10">Automobile</option>
        <option value="11">Bricolage</option>
        <option value="12">Alimentation</option>
        <option value="13">Santé</option>
        <option value="14">Bébés</option>
        <option value="15">Animaux</option>
        <option value="16">Voyages</option>
        <option value="17">Musique</option>
        <option value="18">Films</option>

      </select>
      <div *ngIf="productForm.get('categoryId')?.invalid && (productForm.get('categoryId')?.dirty || productForm.get('categoryId')?.touched)"
           class="text-danger">
        Category is required
      </div>
    </div>
  
    <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">
      {{ isEditMode ? 'Update' : 'Create' }} Product
    </button>
  </form>
