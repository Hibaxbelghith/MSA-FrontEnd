<div class="container mt-4">
    <h2>Product List</h2>
    
    <div class="mb-3">
      <button routerLink="/products/create" class="btn btn-primary">Add New Product</button>
      <button routerLink="/statistics" class="btn btn-info ms-2">View Statistics</button>
    </div>
  
    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>
  
    <div *ngIf="!isLoading && !error">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Description</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let product of products">
              <td>{{ product.id }}</td>
              <td>{{ product.name }}</td>
              <td>{{ product.description | truncate:30 }}</td>
              <td>{{ product.price | currency }}</td>
              <td>{{ product.availableQuantity }}</td>
              <td>{{ product.categoryName }}</td>
              <td>
                <button (click)="viewProduct(product.id)" class="btn btn-sm btn-info me-2">View</button>
                <button (click)="editProduct(product.id)" class="btn btn-sm btn-warning me-2">Edit</button>
                <button (click)="deleteProduct(product.id)" class="btn btn-sm btn-danger">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
