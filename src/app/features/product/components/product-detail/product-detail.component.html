<div class="container mt-4">
    <div *ngIf="isLoading" class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>
  
    <div *ngIf="product && !isLoading" class="card">
      <div class="card-header">
        <h2>Product Details</h2>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <h3>{{ product.name }}</h3>
            <p class="text-muted">{{ product.description }}</p>
            <ul class="list-group list-group-flush">
              <li class="list-group-item">
                <strong>Price:</strong> {{ product.price | currency }}
              </li>
              <li class="list-group-item">
                <strong>Available Quantity:</strong> {{ product.availableQuantity }}
              </li>
              <li class="list-group-item">
                <strong>Category:</strong> {{ product.categoryName }}
              </li>
              <li class="list-group-item">
                <strong>Category Description:</strong> {{ product.categoryDescription }}
              </li>
            </ul>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button routerLink="/products" class="btn btn-secondary">Back to List</button>
        <button [routerLink]="['/products/edit', product.id]" class="btn btn-primary ms-2">Edit</button>
      </div>
    </div>
  </div>
