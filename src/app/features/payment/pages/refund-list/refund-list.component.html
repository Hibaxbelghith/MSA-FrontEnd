<div class="refund-list-container">
  <div class="header">
    <h2>Demandes de Remboursement</h2>
    <button mat-raised-button color="primary" routerLink="/payments">Retour aux paiements</button>
  </div>

  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading">
    <mat-table [dataSource]="refunds" class="mat-elevation-z8">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
        <mat-cell *matCellDef="let refund">{{ refund.id }}</mat-cell>
      </ng-container>

      <!-- Payment ID Column -->
      <ng-container matColumnDef="paymentId">
        <mat-header-cell *matHeaderCellDef>Paiement</mat-header-cell>
        <mat-cell *matCellDef="let refund">{{ refund.payment.id }}</mat-cell>
      </ng-container>

      <!-- Amount Column -->
      <ng-container matColumnDef="amount">
        <mat-header-cell *matHeaderCellDef>Montant</mat-header-cell>
        <mat-cell *matCellDef="let refund">{{ refund.refundAmount | currency }}</mat-cell>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef>Statut</mat-header-cell>
        <mat-cell *matCellDef="let refund">
          <mat-chip [color]="getStatusColor(refund.status)">
            {{ refund.status }}
          </mat-chip>
        </mat-cell>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef>Date</mat-header-cell>
        <mat-cell *matCellDef="let refund">{{ refund.requestDate | date:'medium' }}</mat-cell>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let refund">
          <button *ngIf="refund.status === 'PENDING'" mat-icon-button color="primary" 
                  (click)="approveRefund(refund.id)">
            <mat-icon>check</mat-icon>
          </button>
          <button *ngIf="refund.status === 'PENDING'" mat-icon-button color="warn" 
                  (click)="rejectRefund(refund.id)">
            <mat-icon>close</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
  </div>
</div>
