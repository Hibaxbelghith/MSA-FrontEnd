<!-- refund-form.component.html -->
<div class="refund-form-container">
  <h2>Demande de Remboursement</h2>

  <form [formGroup]="refundForm" (ngSubmit)="onSubmit()" class="mat-elevation-z8">
    <mat-form-field appearance="fill">
      <mat-label>ID Paiement</mat-label>
      <input matInput formControlName="paymentId" readonly>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Montant à rembourser</mat-label>
      <input matInput type="number" formControlName="refundAmount" min="0.01" [max]="maxAmount" step="0.01">
      <mat-error *ngIf="refundForm.get('refundAmount')?.hasError('required')">
        Ce champ est obligatoire
      </mat-error>
      <mat-error *ngIf="refundForm.get('refundAmount')?.hasError('min')">
        Le montant doit être positif
      </mat-error>
      <mat-error *ngIf="refundForm.get('refundAmount')?.hasError('max')">
        Le montant ne peut pas dépasser {{ maxAmount | currency }}
      </mat-error>
    </mat-form-field>

    <div class="form-actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="refundForm.invalid || isLoading">
        <span *ngIf="!isLoading">Soumettre</span>
        <mat-spinner *ngIf="isLoading" diameter="24"></mat-spinner>
      </button>
      <button mat-raised-button type="button" (click)="cancel()">Annuler</button>
    </div>
  </form>
</div>
